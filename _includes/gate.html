<div class="ap-gate" id="apGate" hidden>

  <div class="ap-gate__panel" data-gate-step="warning">
    <h2 class="ap-type--content-1">Content Warning</h2>
    <p class="ap-type--body">This experience contains depictions of guns, blood, violence, and death.</p>
    <button type="button" class="ap-btn ap-btn--primary" id="apGateEnter">I Understand</button>
  </div>

  <div class="ap-gate__panel" data-gate-step="load" hidden>
    <div class="ap-gate__loadbar">
      <span class="ap-gate__loadpct" id="apLoadPct">0%</span>
      <span class="ap-gate__loadtrack">
        <span class="ap-gate__loadfill" id="apLoadFill"></span>
      </span>
    </div>
  </div>

  <div class="ap-gate__glitch" id="apGateGlitch" hidden></div>

</div>
